name: PR metadata
on: pull_request
permissions: {}
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat <<'EOF' > metadata.json
          { "actor": "${{github.actor}}" }
          EOF
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-metadata
          path: metadata.json
