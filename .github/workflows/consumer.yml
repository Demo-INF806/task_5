name: consumer
on:
  workflow_run: {workflows: [PR metadata], types: [completed]}
permissions: {actions: read}
jobs:
  summary:
    runs-on: ubuntu-latest
    env: {FLAG: "${{ secrets.FLAG }}"}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pr-metadata
          path: pr-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: cat pr-artifact/actor.txt >> "$GITHUB_ENV"
      - run: echo -e "### PR metadata\nPR made by $PR_ACTOR" >> "$GITHUB_STEP_SUMMARY"
